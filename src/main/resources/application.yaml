spring:
  application:
    name: ai-interview
  datasource:
    url: jdbc:postgresql://localhost:5433/appdb
    username: hp
    password: 123456
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.6-flash
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            model: gemini-embedding-001
            dimensions: 768
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
server:
  port: 8080
